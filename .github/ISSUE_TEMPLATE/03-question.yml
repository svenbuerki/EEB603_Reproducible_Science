name: Question about the course material
description: Ask about a concept, a tool or a reading. Other students will see the answer too.
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Asking in the open means everyone benefits from the answer, and the thread stays
        searchable for future cohorts. If your question is about your own grade or
        circumstances, email me instead — issues here are public.

  - type: input
    id: topic
    attributes:
      label: What is this about?
      placeholder: Chapt. 4 -- the difference between the FAIR and CARE principles
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you already looked at?
      description: Optional. Which part of the chapter, which reading, or which search — it helps me pitch the answer at the right level.
    validations:
      required: false
